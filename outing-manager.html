let menuEdits=JSON.parse(localStorage.getItem('me')||'{}');
function saveMenuEdits(){localStorage.setItem('me',JSON.stringify(menuEdits));}
function getMenuData(date,mealType){
var key=date+'_'+(mealType==='午'?'lunch':'dinner');
var md=menuData[key]||null;
if(!md)return null;
var edits=menuEdits[key]||{};
var removed=edits.removed||[];
var dishes=md.dishes.map(function(d,i){
var ed=edits['d'+i]||{};
return {_id:'d'+i,cat:d.cat,name:ed.name||d.name,price:ed.price!==undefined?ed.price:d.price};
});
if(edits.added){edits.added.forEach(function(a,i){dishes.push({_id:'a'+i,cat:a.cat,name:a.name,price:a.price});});}
if(removed.length){dishes=dishes.filter(function(d){return removed.indexOf(d._id)===-1;});}
return {deposit:md.deposit,tableInfo:md.tableInfo,tables:md.tables,dishes:dishes};
}
function showMenu(date,restaurant,mealType){
var md=getMenuData(date,mealType);
if(!md){showToast('该餐暂无菜单数据');return;}
var key=date+'_'+(mealType==='午'?'lunch':'dinner');
var total=md.dishes.reduce(function(s,d){return s+(Number(d.price)||0);},0);
var grandTotal=total*md.tables;
var perPerson=md.tables>0?Math.round(grandTotal/(md.tables*10)):0;
var deposit=md.deposit||0;
var balance=grandTotal-deposit;
var h='<div class="menu-popup"><div class="menu-popup-header"><button class="btn btn-sm" onclick="closeMenu()">← 返回</button><h3>📋 '+date+' '+mealType+'餐 - '+restaurant+'</h3><div></div></div><div class="menu-popup-body">';
h+='<div style="font-size:12px;color:#999;margin-bottom:8px">桌数：'+md.tableInfo+' | 定金：¥'+deposit+' | 余额：¥'+balance.toLocaleString()+'</div>';
h+='<div class="menu-dishes"><table style="width:100%;font-size:13px"><thead><tr><th>类别</th><th>菜品</th><th style="width:70px">单价</th><th style="width:50px"></th></tr></thead><tbody>';
var cats={'凉':'凉菜','肉':'肉菜','素':'素菜','主食':'主食','汤':'汤','饮料':'饮料','其他':'其他'};
Object.keys(cats).forEach(function(cat){
var items=md.dishes.filter(function(d){return d.cat===cat;});
if(items.length===0)return;
h+='<tr><td colspan="4" style="background:#f5f7fa;font-weight:600;font-size:12px;color:#1a3a5c">'+cats[cat]+'（'+items.length+'）</td></tr>';
items.forEach(function(d,i){
var dishId=d._id;
h+='<tr><td></td><td><input value="'+d.name+'" onchange="editMenuItem(\''+key+'\',\''+dishId+'\',\'name\',this.value)" style="border:none;background:transparent;width:100%;font-size:13px;font-family:inherit"></td><td><input type="number" value="'+d.price+'" onchange="editMenuItem(\''+key+'\',\''+dishId+'\',\'price\',Number(this.value))" style="width:60px;padding:2px 4px;border:1px solid #e8e8e8;border-radius:4px;font-size:12px;text-align:right;font-family:inherit"></td><td><button class="btn btn-sm" onclick="removeMenuItem(\''+key+'\',\''+dishId+'\')" style="color:#ff4d4f">✕</button></td></tr>';
});
});
h+='</tbody></table></div>';
h+='<div class="menu-totals"><div style="font-size:14px;font-weight:600">一桌合计，'+md.dishes.length+'个菜，¥'+total.toLocaleString()+'</div><div style="font-size:16px;font-weight:700;color:#1a3a5c">总价（'+md.tables+'桌）：¥'+grandTotal.toLocaleString()+'</div><div style="font-size:13px;color:#666">人均：¥'+perPerson+'</div></div>';
h+='<div style="margin-top:12px;padding-top:12px;border-top:1px solid #e8e8e8"><div style="font-size:13px;font-weight:600;margin-bottom:8px">➕ 添加菜品</div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end"><select id="newDishCat" style="padding:6px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;font-family:inherit"><option value="凉">凉菜</option><option value="肉">肉菜</option><option value="素">素菜</option><option value="主食">主食</option><option value="汤">汤</option><option value="饮料">饮料</option><option value="其他">其他</option></select><input id="newDishName" placeholder="菜品名称" style="padding:6px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;width:140px;font-family:inherit"><input id="newDishPrice" type="number" placeholder="单价" style="padding:6px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;width:70px;font-family:inherit"><button class="btn btn-primary" onclick="addMenuItem(\''+key+'\')">确定添加</button></div></div><button class="btn btn-sm" onclick="closeMenu()" style="margin-top:8px;width:100%">关闭</button>';
h+='</div></div>';
document.getElementById('overlay').style.display='block';
var popup=document.getElementById('menuPopup');
popup.innerHTML=h;popup.style.display='block';
}
function closeMenu(){
document.getElementById('overlay').style.display='none';
document.getElementById('menuPopup').style.display='none';
}
function editMenuItem(key,dishId,field,val){
if(!menuEdits[key])menuEdits[key]={};
if(!menuEdits[key][dishId])menuEdits[key][dishId]={};
menuEdits[key][dishId][field]=val;
saveMenuEdits();
}
function removeMenuItem(key,dishId){
if(!menuEdits[key])menuEdits[key]={};
if(!menuEdits[key].removed)menuEdits[key].removed=[];
menuEdits[key].removed.push(dishId);
saveMenuEdits();
var d=key.replace('_lunch','').replace('_dinner','');
var mt=key.indexOf('lunch')>=0?'午':'晚';
var restEl=document.querySelector('.menu-popup-header h3');
var rest=restEl?restEl.textContent.replace(/^📋 \d{4}-\d{2}-\d{2} [午晚]餐 - /,''):'';
showMenu(d,rest,mt);
}
function addMenuItem(key){
var cat=document.getElementById('newDishCat').value;
var name=document.getElementById('newDishName').value.trim();
var price=Number(document.getElementById('newDishPrice').value);
if(!name||!price){showToast('请填写菜品名称和单价');return;}
if(!menuEdits[key])menuEdits[key]={};
if(!menuEdits[key].added)menuEdits[key].added=[];
menuEdits[key].added.push({cat:cat,name:name,price:price});
saveMenuEdits();
var d=key.replace('_lunch','').replace('_dinner','');
var mt=key.indexOf('lunch')>=0?'午':'晚';
var restEl=document.querySelector('.menu-popup-header h3');
var rest=restEl?restEl.textContent.replace(/^📋 \d{4}-\d{2}-\d{2} [午晚]餐 - /,''):'';
showMenu(d,rest,mt);
}

function addInvoice(){
var d=document.getElementById('newInvDate').value;
var item=document.getElementById('newInvItem').value.trim();
var amt=Number(document.getElementById('newInvAmt').value);
if(!d||!item||!amt){showToast('请填写完整信息');return;}
invoices.push({date:d,restaurant:item,mealType:'其他',amount:amt,time:new Date().toISOString()});
saveInvoices();renderInvoices();showToast('✅ 已添加');
}
function editInvoice(i){
var inv=invoices[i];
var newAmt=prompt('修改金额（当前 ¥'+Number(inv.amount).toLocaleString()+'）：',inv.amount);
if(newAmt===null)return;
var newItem=prompt('修改项目（当前：'+inv.restaurant+'）：',inv.restaurant);
if(newItem===null)return;
invoices[i].amount=Number(newAmt);
invoices[i].restaurant=newItem;
saveInvoices();renderInvoices();showToast('✅ 已修改');
}
function deleteInvoice(i){
if(!confirm('确认删除「'+invoices[i].restaurant+' ¥'+Number(invoices[i].amount).toLocaleString()+'」？'))return;
invoices.splice(i,1);
saveInvoices();renderInvoices();showToast('✅ 已删除');
}

function genNotify(d,idx){
var nd=days[idx+1],m='';
if(idx===0){m='【出发提醒】🚄\n\n各位同事，明天8月9日我们出发啦！\n\n📅 集合时间：8:30\n📍 集合地点：北京丰台站 31B检票口\n🚄 车次：G683 12:38→太原南站 15:45\n🚌 到达后大巴接站→兰欧国际酒店\n\n⚠️ 必带物品：身份证、手机、充电器\n🌤️ 太原天气：请查看天气预报';}
else if(idx===1||idx===2){m='【培训提醒】📚\n\n各位同事，今天是8月'+(idx===1?'10':'11')+'日培训日，地点：兰欧国际酒店会议室。\n\n📅 培训开始时间：8:30，请大家提前到会场\n📋 具体日程见群内培训安排表\n\n午餐：酒店自助餐\n晚餐：'+(idx===1?'自由用餐（推荐食品街/柳巷）':'御河伍号（水西关店）18:30');}
else if(idx===10){m='【返程提醒】🔙\n\n各位同事，今天是返程日！\n\n📅 7:30 集合出发 → 郑州东站\n🚄 北京同事：G374 9:03→北京西站 11:30\n🚌 11:40 北京西站接站→送回公司\n✈️ 外地同事：请留意各自返程车次/航班\n\n⚠️ 退房前检查：身份证、手机、充电器、个人物品\n\n祝大家一路平安！到家后在群里报个平安 🙏';}
else{var dl={'3':'12','4':'13','5':'14','6':'15','7':'16','8':'17','9':'18'};m='【今日行程】🏔️ 8月'+dl[idx]+'日\n\n'+d.detail.split('\n').map(function(l){return '📍 '+l;}).join('\n')+'\n\n';if(d.hotel&&d.hotel!=='-'){m+='🏨 今晚入住：'+d.hotel+'\n📌 '+d.hotelAddr+'\n';}if(d.meals.length){d.meals.forEach(function(ml){m+='\n🍽️ '+ml.type+'餐：'+ml.restaurant+' ('+ml.time+')';});}}
if(nd&&nd.type==='training'){m+='\n\n📚 明天是培训日，培训开始时间8:30，请大家提前到会场！';}
if(nd&&nd.hotel&&nd.hotel!=='-'&&d.hotel!==nd.hotel){m+='\n\n🧳 明天入住不同酒店（'+nd.hotel+'），请明早带好行李，检查个人物品！';}
return m;}
function renderPeople(){

h+='<div style="display:flex;flex-wrap:wrap;gap:4px">';trainOut.people.forEach(function(p){h+='<span class="tag train">'+p+'</span>';});h+='</div></div>';

h+='<div style="overflow-x:auto"><table style="min-width:600px;font-size:12px"><tr><th style="width:50px">窗</th><th style="width:90px">A</th><th style="width:90px">B</th><th style="width:90px">C</th><th style="width:30px;background:#eee">走道</th><th style="width:90px">D</th><th style="width:50px">窗</th></tr>';
var sm={8:{},9:{},10:{},11:{},12:{},13:{}};
trainMeals.forEach(function(tm){var r=parseInt(tm.seat);var col=tm.seat.slice(-1);sm[r][col]=tm;});
[8,9,10,11,12,13].forEach(function(r){
h+='<tr><td style="text-align:center;background:#f5f7fa;font-weight:600">第'+r+'排</td>';
['A','B','C','D'].forEach(function(col){
var s=sm[r][col];
if(s){h+='<td style="background:#f0f7ff;padding:6px;text-align:center;font-size:11px"><div style="font-weight:600">'+s.name+'</div><div style="color:#666;margin-top:2px">'+s.seat+'</div><div style="color:#d48806;margin-top:2px">'+s.meal+'</div></td>';}
else if(col==='D'){h+='<td style="background:#f9f9f9;text-align:center;color:#ccc;font-size:11px">（空）</td>';}
else{h+='<td style="background:#f9f9f9;text-align:center;color:#ccc;font-size:11px;border-right:1px solid #e8e8e8">（空）</td>';}
if(col==='C'){h+='<td style="background:#eee;text-align:center;font-size:9px;color:#999">走道</td>';}
});
h+='</tr>';
});
h+='</table></div></div>';
h+='<div class="card"><h3>🚄 返程火车票</h3>';
h+='<div style="margin-bottom:8px"><b>8月19日 '+trainBack.from+' → '+trainBack.to+'</b><br>车次：'+trainBack.train+' '+trainBack.time+' | 检票口：'+trainBack.gate+' | '+trainBack.car+' | 人数：'+trainBack.people.length+'人</div>';
h+='<div style="display:flex;flex-wrap:wrap;gap:4px">';trainBack.people.forEach(function(p){h+='<span class="tag train">'+p+'</span>';});h+='</div></div>';
h+='<div class="card"><h3>🏨 住宿名单（8/9-8/12 兰欧国际酒店）</h3>';
var rt={};
hotelRooms.rooms.forEach(function(r){
var key=r.type;
if(!rt[key])rt[key]=[];
var names=r.p1+(r.p2&&r.p2!=='-'?'、'+r.p2:'');
rt[key].push(names);
});
Object.keys(rt).forEach(function(type){
h+='<div style="margin-bottom:12px"><div style="font-size:13px;font-weight:600;color:#1a3a5c;margin-bottom:4px">'+type+'（'+rt[type].length+'间）</div>';
rt[type].forEach(function(n,i){h+='<div style="font-size:13px;padding:4px 0;border-bottom:1px solid #f0f0f0">'+(i+1)+'. '+n+'</div>';});

});

document.getElementById('panel-5').innerHTML=h;}
function switchTab(idx){document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});document.querySelectorAll('.panel').forEach(function(p,i){p.classList.toggle('active',i===idx);});}
function toggleTask(id){var t=tasks.find(function(t){return t.id===id;});if(t){t.done=!t.done;saveTasks();renderTasks();updateBadge();if(t.done){showToast('✅ 任务已完成');if(navigator.vibrate)navigator.vibrate(50);}}}
function toggleNotify(){notifyOn=!notifyOn;saveNotify();renderTasks();if(notifyOn&&Notification.permission==='default'){Notification.requestPermission();}}
function saveMealCost(key,val){if(val)mealCosts[key]=val;else delete mealCosts[key];saveMealCosts();renderOverview();}
function showInvoice(mk,date,restaurant,mealType){
var amount=mealCosts[mk]||'0';
var popup=document.getElementById('invoicePopup');
popup.innerHTML='<h3>🧾 开票信息</h3><div class="field"><div class="label">公司名称</div><div class="value">'+C.name+'</div></div><div class="field"><div class="label">纳税人识别号</div><div class="value">'+C.taxId+'</div></div><div class="field"><div class="label">电子发票接收邮箱</div><div class="value">'+C.email+'</div></div><div class="field"><div class="label">开票金额</div><div class="value" style="font-size:20px;font-weight:700;color:#1a3a5c">¥'+Number(amount).toLocaleString()+'</div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-primary" onclick="copyInvoice()">📋 一键复制开票信息</button><button class="btn btn-success" onclick="confirmInvoice(\''+mk+'\',\''+date+'\',\''+restaurant.replace(/'/g,'\\\'')+'\',\''+mealType+'\',\''+amount+'\')">✅ 确认已开票</button><button class="btn" onclick="closeInvoice()">关闭</button></div>';
document.getElementById('overlay').style.display='block';popup.style.display='block';}
function closeInvoice(){document.getElementById('overlay').style.display='none';document.getElementById('invoicePopup').style.display='none';}
function copyInvoice(){navigator.clipboard.writeText('公司名称：'+C.name+'\n纳税人识别号：'+C.taxId+'\n邮箱：'+C.email).then(function(){alert('开票信息已复制到剪贴板！可直接粘贴给餐厅');});}
function confirmInvoice(mk,date,restaurant,mealType,amount){invoices.push({mk:mk,date:date,restaurant:restaurant,mealType:mealType,amount:Number(amount),time:new Date().toISOString()});saveInvoices();closeInvoice();renderInvoices();alert('已记录开票！');}
function copyText(btn){var box=btn.parentElement,text=box.textContent.replace('📋复制','').trim();navigator.clipboard.writeText(text).then(function(){btn.textContent='✅已复制';setTimeout(function(){btn.textContent='📋复制';},2000);});}
function exportInvoices(){
var data=[['日期','餐别','餐厅','金额','开票时间','公司名称','纳税人识别号','邮箱']];
invoices.forEach(function(inv){data.push([inv.date,inv.mealType,inv.restaurant,inv.amount,new Date(inv.time).toLocaleString('zh-CN'),C.name,C.taxId,C.email]);});
var total=invoices.reduce(function(s,inv){return s+Number(inv.amount);},0);data.push(['','','合计',total,'','','','']);
var ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=[{wch:12},{wch:8},{wch:30},{wch:12},{wch:20},{wch:40},{wch:25},{wch:30}];
var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'发票汇总');XLSX.writeFile(wb,'诺达思2026SummerOuting_发票汇总.xlsx');}
function checkNotify(){
if(!notifyOn)return;if(Notification.permission==='default'){Notification.requestPermission();}
if(Notification.permission!=='granted')return;
var today=getToday(),now=new Date(),hour=now.getHours();
if(hour<8||hour>20)return;
tasks.forEach(function(t){
if(t.done||t.notified||t.date!==today)return;
if(t.notifyHour!==undefined&&hour<t.notifyHour)return;
t.notified=true;saveTasks();
try{new Notification('⏰ 活动提醒',{body:t.title+'\n'+t.detail,icon:'🏔️'});}catch(e){}
});}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
function updateBadge(){var today=getToday(),cnt=tasks.filter(function(t){return t.date===today&&!t.done;}).length;var b=document.getElementById('taskBadge');if(b){b.style.display=cnt>0?'inline':'none';b.textContent=cnt;}}
function installApp(){if(window.deferredPrompt){window.deferredPrompt.prompt();window.deferredPrompt.userChoice.then(function(r){if(r.outcome==='accepted'){document.getElementById('installBanner').classList.remove('show');showToast('📲 已添加到主屏幕');}window.deferredPrompt=null;});}else{showToast('📲 请使用浏览器菜单中的"添加到主屏幕"功能');}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.deferredPrompt=e;document.getElementById('installBanner').classList.add('show');});
window.addEventListener('appinstalled',function(){document.getElementById('installBanner').classList.remove('show');showToast('✅ 应用已安装！');});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=3').then(function(){console.log('SW registered');}).catch(function(){console.log('SW failed');});}

async function sha256(str){var buf=new TextEncoder().encode(str);var hash=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
function checkLogin(){var pwd=document.getElementById('loginPwd').value;sha256(pwd).then(function(h){if(h==='c64ddde4d1280e7f497d72d52e6456affab1625bf7f2adee6ebf6e7f43a51b4f'){document.getElementById('loginOverlay').classList.add('hidden');document.getElementById('loginPwd').value='';}else{document.getElementById('loginErr').style.display='block';document.getElementById('loginPwd').value='';}});}
document.getElementById('loginPwd').addEventListener('keydown',function(e){if(e.key==='Enter')checkLogin();});

renderAll();
setInterval(function(){document.getElementById('countdown').textContent=countdownStr();checkNotify();updateBadge();},30000);
